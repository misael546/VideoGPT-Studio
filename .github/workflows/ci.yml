name: VideoGPT Studio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install FFmpeg for local render integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate resource library and video generator
        run: |
          python -m py_compile scripts/generate-free-isekai.py scripts/validate-resource-library.py
          python scripts/validate-resource-library.py
          python -m py_compile cutter-agent/cutter.py cutter-agent/edit_plan.py cutter-agent/render.py cutter-agent/review_server.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check server syntax
        run: node --check src/server.js
      - name: Check browser script syntax
        run: |
          node --check public/app.js
          node --check public/editor.js
          node --check public/edit-plan.js
          node --check public/natural-language.js
          node --check public/assistant-planner.js
          node --check public/advanced-tools.js
          node --check cutter-agent/review.js
          test -s public/editor.html
          test -s public/editor.css
          test -s cutter-agent/review.html
          test -s cutter-agent/review.css
      - name: Test edit plan validator
        run: npm test
      - name: Smoke test API
        run: |
          node src/server.js > /tmp/videogpt.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/videogpt.log
          exit 1
      - name: Assemble standalone Cutter Studio local package
        run: |
          mkdir -p dist/Cutter-Studio
          cp cutter-agent/cutter.py cutter-agent/edit_plan.py cutter-agent/render.py cutter-agent/review_server.py dist/Cutter-Studio/
          cp cutter-agent/review.html cutter-agent/review.css cutter-agent/review.js cutter-agent/INICIAR_CUTTER_STUDIO.bat cutter-agent/README.md dist/Cutter-Studio/
          printf 'Commit: %s\nBuilt (UTC): %s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/Cutter-Studio/BUILD_INFO.txt
          python -m py_compile dist/Cutter-Studio/cutter.py dist/Cutter-Studio/edit_plan.py dist/Cutter-Studio/render.py dist/Cutter-Studio/review_server.py
          node --check dist/Cutter-Studio/review.js
          test -s dist/Cutter-Studio/INICIAR_CUTTER_STUDIO.bat
          test -s dist/Cutter-Studio/review_server.py
          (cd dist/Cutter-Studio && sha256sum *.py *.js *.html *.css *.bat *.md BUILD_INFO.txt > SHA256SUMS.txt)
          test -s dist/Cutter-Studio/SHA256SUMS.txt
      - name: Upload standalone Cutter Studio Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Cutter-Studio-Windows-Local
          path: dist/Cutter-Studio/
          if-no-files-found: error
          retention-days: 30
