name: VideoGPT Studio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check src/server.js
      - name: Check browser script syntax
        run: node --check public/app.js
      - name: Check Vercel entrypoint syntax
        run: node --check api/index.js
      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8'))"
      - name: Smoke test API
        run: |
          node src/server.js > /tmp/videogpt.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/videogpt.log
          exit 1
