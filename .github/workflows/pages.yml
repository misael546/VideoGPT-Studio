name: Publish VideoGPT Studio on GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate upload page and hidden editing workspace
        run: |
          set -euo pipefail
          test -s public/editor.html
          test -s public/editor.css
          grep -q 'id="videoFile"' public/editor.html
          grep -q 'id="sourcePreview"' public/editor.html
          grep -q 'Selecciona o arrastra tu video aquí' public/editor.html
          grep -q '<section id="editingWorkspace" class="editor-panel hidden">' public/editor.html
          grep -q 'id="exportButton"' public/editor.html
          echo "Upload-first page verified; editing workspace starts hidden."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
