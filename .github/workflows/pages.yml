name: Publish VideoGPT Studio on GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate upload-only page
        run: |
          set -euo pipefail
          test -s public/editor.html
          test -s public/editor.css
          grep -q 'id="videoFile"' public/editor.html
          grep -q 'id="videoPreview"' public/editor.html
          grep -q 'Selecciona o arrastra tu video aquí' public/editor.html
          if grep -q 'id="exportButton"' public/editor.html; then
            echo "Unexpected editing/export controls found in upload-only page."
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
