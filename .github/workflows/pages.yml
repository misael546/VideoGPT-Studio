name: Publish VideoGPT Studio on GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate upload page and hidden editing workspace
        run: |
          set -euo pipefail
          test -s public/editor.html
          test -s public/editor.css
          grep -q 'id="videoFile"' public/editor.html
          grep -q 'id="videoPreview"' public/editor.html
          grep -q 'Selecciona o arrastra tu video aquí' public/editor.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('public/editor.html', 'utf8');
          const workspaceStart = html.indexOf('<section id="editingWorkspace" class="editor-panel hidden">');
          const exportButton = html.indexOf('id="exportButton"');
          const footer = html.indexOf('<footer', workspaceStart);
          if (workspaceStart < 0) throw new Error('Editing workspace must be hidden on initial page load.');
          if (exportButton < workspaceStart || footer < 0 || exportButton > footer) {
            throw new Error('Export controls must remain inside the initially hidden editing workspace.');
          }
          console.log('Upload-first page verified; editing workspace is hidden until the user chooses a goal.');
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
