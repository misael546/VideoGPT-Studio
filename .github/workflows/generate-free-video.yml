name: Generate free illustrated video

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-free-isekai.py"
      - ".github/workflows/generate-free-video.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts
      - name: Generate illustrated video without paid APIs
        run: python scripts/generate-free-isekai.py
      - name: Verify video
        run: |
          test -s public/videos/isekai-test.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 public/videos/isekai-test.mp4
      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/isekai-test.mp4
          git commit -m "Add free illustrated isekai test video"
          git push origin "HEAD:${{ github.ref_name }}"
