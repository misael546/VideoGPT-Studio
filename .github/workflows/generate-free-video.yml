name: Generate free illustrated video

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-free-isekai.py"
      - ".github/workflows/generate-free-video.yml"

permissions:
  contents: write

# Prevent simultaneous renders from racing to commit the same MP4.
concurrency:
  group: free-video-generation-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts cairosvg
      - name: Validate generator and reusable resource catalog
        run: |
          python -m py_compile scripts/generate-free-isekai.py
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(".").resolve()
          catalog = json.loads((root / "recursos/catalogo.json").read_text(encoding="utf-8"))
          for item in catalog.get("resources", []):
              if item.get("type") != "image_overlay":
                  continue
              path = (root / item["path"]).resolve()
              assert root in path.parents and path.is_file(), f"Recurso local ausente o fuera del repo: {item.get('path')}"
              if path.suffix.lower() == ".svg":
                  ET.parse(path)
          print("Catálogo JSON, rutas locales y SVG: OK")
          PY
      - name: Generate illustrated video without paid APIs
        run: python scripts/generate-free-isekai.py
      - name: Verify extended video and audio
        run: |
          test -s public/videos/isekai-mejorado.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_type -of json public/videos/isekai-mejorado.mp4 > /tmp/video-probe.json
          python - <<'PY'
          import json
          with open("/tmp/video-probe.json", encoding="utf-8") as f:
              data = json.load(f)
          duration = float(data.get("format", {}).get("duration", 0))
          size = int(data.get("format", {}).get("size", 0))
          types = {stream.get("codec_type") for stream in data.get("streams", [])}
          assert duration >= 55, f"Video demasiado corto: {duration:.1f}s"
          assert size > 100_000, f"MP4 demasiado pequeño: {size} bytes"
          assert {"video", "audio"}.issubset(types), f"Faltan pistas: {types}"
          print(f"MP4 válido: {duration:.1f}s, {size} bytes, pistas={types}")
          PY
      - name: Commit video safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/isekai-mejorado.mp4 public/videos/gallery.json
          if git diff --cached --quiet; then
            echo "The generated MP4 is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Add extended illustrated isekai video"
          # Integrate any documentation/code commits that landed while rendering.
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
